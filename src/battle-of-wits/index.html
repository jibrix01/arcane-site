<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootcamp 13.0</title>
    <link rel="icon" type="image/svg+xml" href="/favicon_tarot.svg" />
    <link rel="preconnect" href="/https://fonts.googleapis.com" />
    <link rel="preconnect" href="/https://fonts.gstatic.com" crossorigin />
    <link
      href="/https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/src/battle-of-wits/login.css" />
    <script type="module" src="/js/auth-guard.js"></script>
  </head>

  <body>
    <canvas id="embers" aria-hidden="true"></canvas>

    <div id="nav-placeholder"></div>
    <script src="/js/load-nav.js"></script>
    <main>
      <div class="wrap">
        <div class="page-head">
          <p>Signed in as <strong id="user-email"></strong></p>
          <script type="module" src="/js/user.js"></script>
          <button
            type="button"
            data-logout
            class="login-linklike"
            style="margin-top: 0.75rem"
          >
            Sign out
          </button>
        </div>

        <div id="game-area" class="game-area">
          <p>Loading your Arcana...</p>
        </div>
        <div class="mod-dashboard" id="mod-dashboard" hidden>
          <section class="mod-panel" id="round-panel"></section>
          <section class="mod-panel" id="leaderboard-panel"></section>
        </div>
        <script type="module" src="/js/game.js"></script>
        <script type="module" src="/js/mod.js"></script>
      </div>
    </main>

    <footer class="site-foot">
      &#10022; The Arcana watches in silence &#10022;
    </footer>

    <script src="/js/embers.js"></script>
  </body>
</html>
