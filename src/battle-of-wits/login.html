<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter the Arcane — Bootcamp 13.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/battle-of-wits/login.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <canvas id="embers" aria-hidden="true"></canvas>
    <div id="nav-placeholder"></div>
    <script src="/js/load-nav.js"></script>
    <main class="login-main">
      <div class="wrap login-wrap">
        <div class="page-head login-head">
          <p class="eyebrow">The Threshold</p>
          <h1>Enter the Arcane</h1>
          <p>
            Present your seal, traveler, and the eight Houses shall open to you.
          </p>
        </div>

        <div class="login-card" role="form" aria-label="Sign in">
          <div class="login-card__crest">&#10022;</div>
          <form id="auth-form" novalidate>
            <label class="login-field">
              <span class="login-field__label">Email</span>
              <input
                type="email"
                name="email"
                id="email"
                class="login-input"
                autocomplete="email"
                required
                placeholder="you@example.com"
              />
            </label>

            <label class="login-field">
              <span class="login-field__label">Password</span>
              <input
                type="password"
                name="password"
                id="password"
                class="login-input"
                autocomplete="current-password"
                required
                minlength="6"
                placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
              />
            </label>

            <p id="auth-error" class="login-error" role="alert" hidden></p>
            <p id="auth-success" class="login-success" role="status" hidden></p>

            <button type="submit" id="auth-submit" class="login-btn">
              <span class="login-btn__label">Sign In</span>
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-foot">
      &#10022; The Arcana watches in silence &#10022;
    </footer>

    <script src="/js/embers.js"></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
