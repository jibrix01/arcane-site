<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

  <body>
    <canvas id="embers" aria-hidden="true"></canvas>

    <div id="nav-placeholder"></div>
    <script src="js/load-nav.js"></script>

    <main>
      <div class="wrap">
        <div class="page-head">
          <p class="eyebrow">The Path, Written in Stars</p>
          <h1>Program &amp; Events</h1>
          <p>
            Three days, three chapters. The Past, the Present, and the Future,
            mapped across the sky.
          </p>
        </div>

        <div class="roadmap-frame">
          <img
            src="assets/roadmap.png"
            alt="Bootcamp 13.0 three-day program roadmap, styled as a constellation chart across Day I: The Past, Day II: The Present, and Day III: The Future"
          />
        </div>

        <div class="roadmap-actions">
          <a
            class="rune-button"
            href="assets/roadmap.png"
            target="_blank"
            rel="noopener"
            >&#10022; View Full Size</a
          >
        </div>
      </div>
    </main>

    <footer class="site-foot">
      &#10022; The Arcana watches in silence &#10022;
    </footer>

    <script src="js/embers.js"></script>
